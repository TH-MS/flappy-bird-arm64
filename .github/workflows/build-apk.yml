name: Build Android APK (arm64)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25            # fail fast instead of hanging
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Extract original art + sounds (only if Flappy_Bird_1.3.apk is in the repo)
        timeout-minutes: 3
        run: |
          if [ -f Flappy_Bird_1.3.apk ]; then
            bash tools/extract_assets.sh Flappy_Bird_1.3.apk
            ls -la assets/gfx assets/audio
          else
            echo "No original APK found - building with placeholder art."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK pieces Godot 4.5 wants
        timeout-minutes: 8
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" "platforms;android-35" | tail -3

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot for Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          envsubst < tools/editor_settings.tres > ~/.config/godot/editor_settings-4.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.5.tres
          cat ~/.config/godot/editor_settings-4.5.tres

      - name: Import assets
        timeout-minutes: 5
        run: timeout 240 godot --headless --editor --quit --path . || echo "import exited with $?"

      - name: Export APK
        timeout-minutes: 8
        run: |
          mkdir -p build
          timeout 420 godot --headless --verbose --path . --export-debug "Android arm64" build/flappy64.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: flappy64-apk
          path: build/flappy64.apk
