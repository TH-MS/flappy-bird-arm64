name: Build Android APK (arm64)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25            # fail fast instead of hanging
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Extract original art + sounds (uses any .apk in the repo root)
        timeout-minutes: 3
        run: |
          APK="$(ls ./*.apk 2>/dev/null | head -1 || true)"
          if [ -n "$APK" ]; then
            echo "Using $APK"
            bash tools/extract_assets.sh "$APK"
            ls -la assets/gfx assets/audio
          else
            echo "No original APK found - building with placeholder art."
          fi

      - name: Original launcher icon
        timeout-minutes: 3
        run: |
          pip install --quiet pillow
          python3 tools/make_icons.py tools/icon_source.png assets/icon
          sed -i '/^\[preset.0.options\]/a launcher_icons/main_192x192="res://assets/icon/main.png"\nlauncher_icons/adaptive_foreground_432x432="res://assets/icon/adaptive_fg.png"\nlauncher_icons/adaptive_background_432x432="res://assets/icon/adaptive_bg.png"' export_presets.cfg
          grep -n launcher_icons export_presets.cfg

      - name: Force plain (non-Gradle) export
        run: |
          sed -i 's/use_gradle_build=true/use_gradle_build=false/' export_presets.cfg
          # increasing version code per build: Android only accepts an update if it is not lower
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"1.0.${{ github.run_number }}\"/" export_presets.cfg
          grep -n "gradle\|arm64" export_presets.cfg
          # Godot refuses Android export unless ETC2/ASTC texture import is enabled
          grep -q "import_etc2_astc" project.godot || \
            sed -i 's#^renderer/rendering_method="mobile"#textures/vram_compression/import_etc2_astc=true\n&#' project.godot
          grep -n "etc2" project.godot

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK pieces Godot 4.5 wants
        timeout-minutes: 8
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" "platforms;android-35" | tail -3

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot for Android
        run: |
          # fixed signing key (committed) so every build can install as an UPDATE over the last one
          cp tools/debug.keystore "$HOME/debug.keystore"
          mkdir -p ~/.config/godot
          envsubst < tools/editor_settings.tres > ~/.config/godot/editor_settings-4.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.5.tres
          cat ~/.config/godot/editor_settings-4.5.tres

      - name: Import assets
        timeout-minutes: 5
        run: timeout 240 godot --headless --editor --quit --path . || echo "import exited with $?"

      - name: Export APK
        timeout-minutes: 8
        run: |
          mkdir -p build
          timeout 420 godot --headless --verbose --path . --export-debug "Android arm64" build/flappy64.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: flappy64-apk
          path: build/flappy64.apk
