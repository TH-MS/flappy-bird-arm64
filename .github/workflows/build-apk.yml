name: Build Android APK (arm64)
on:
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Extract original art + sounds (only if Flappy_Bird_1.3.apk is in the repo)
        run: |
          if [ -f Flappy_Bird_1.3.apk ]; then
            apt-get update -qq && apt-get install -y -qq unzip python3
            bash tools/extract_assets.sh Flappy_Bird_1.3.apk
          else
            echo "No original APK found - building with placeholder art."
          fi

      - name: Set up Godot export templates and debug keystore
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.5.1.stable ~/.local/share/godot/export_templates/ || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /root/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cp tools/editor_settings.tres ~/.config/godot/editor_settings-4.tres
          cp tools/editor_settings.tres ~/.config/godot/editor_settings-4.5.tres

      - name: Import project and export APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android arm64" build/flappy64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: flappy64-apk
          path: build/flappy64.apk
