name: Build Android APK (arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - uses: actions/checkout@v4

      - name: Extract original art + sounds
        run: |
          APK_FILE=$(find . -maxdepth 1 -iname "*flappy*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE - extracting assets..."
            apt-get update && apt-get install -y unzip python3 curl
            bash tools/extract_assets.sh "$APK_FILE"
          else
            echo "No original APK found - building with placeholder art."
          fi

      - name: Install Godot Export Templates
        run: |
          GODOT_VERSION="4.5.1.stable"
          TEMPLATE_DIR="/github/home/.local/share/godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          
          echo "Downloading Godot export templates..."
          curl -sL https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz -o templates.tpz
          unzip -q templates.tpz
          mv templates/* "$TEMPLATE_DIR/"
          rm -rf templates.tpz templates

      - name: Set up debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Import project and export APK
        run: |
          mkdir -p _apk
          godot --headless --export-release "Android arm64" _apk/flappy64.apk || godot --headless --export-debug "Android arm64" _apk/flappy64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flappy64-apk
          path: _apk/flappy64.apk
